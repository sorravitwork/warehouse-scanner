name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk \
          autoconf libtool libtool-bin pkg-config \
          zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev gettext
        pip install buildozer==1.5.0 cython==0.29.33
        pip install python-for-android==2023.9.16

    - name: Build APK
      run: |
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: warehouse-scanner-apk
        path: bin/*.apk
